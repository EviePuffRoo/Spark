      rel="stylesheet"

    <script>
      (function () {
        try {
          var raw = localStorage.getItem("spark-theme");
          var theme = raw ? JSON.parse(raw) : null;
          if (theme === "dark" || theme === "light") {
            document.documentElement.setAttribute("data-theme", theme);
          }
        } catch (e) {}
      })();
    </script>
