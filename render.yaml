services:
  - type: web
    name: spark
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build --workspace client
    startCommand: npm run migrate:deploy --workspace server && npm run start:server
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    domains:
      - sparkdm.quest
    disk:
      name: spark-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: file:/var/data/spark.db
      - key: NODE_VERSION
        value: 22.22.2
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Read by the client build (buildCommand below), not at runtime —
      # Vite inlines VITE_-prefixed vars into the built bundle. Still set
      # here (not just locally) so it's present in Render's build environment.
      - key: VITE_SENTRY_DSN
        sync: false
